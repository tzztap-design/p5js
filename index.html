<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My p5.js Creative Coding Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>p5.js Creative Coding Portfolio</h1>
        <p>p5.js를 이용한 웹 아트를 소개합니다.</p>
    </header>

    <main class="grid-container">
        <section class="card animate-up">
            <div class="card-header">
                <span class="badge static">정적</span>
                <h2>과제 1: 추상화 그리기</h2>
            </div>
            <div class="iframe-container ratio-horizontal">
                <iframe src="sample1/index.html" title="과제 1"></iframe>
            </div>
        </section>

        <section class="card animate-up delay-1">
            <div class="card-header">
                <span class="badge dynamic">동적</span>
                <h2>과제 4: 자신의 추상화에 시간에 따른 움직임 넣기</h2>
            </div>
            <div class="iframe-container ratio-horizontal">
                <iframe src="sample4/index.html" title="과제 4"></iframe>
            </div>
        </section>

        <section class="card animate-up delay-2">
            <div class="card-header">
                <span class="badge static">정적</span>
                <h2>과제 2: 캐릭터 그리기</h2>
            </div>
            <div class="iframe-container ratio-vertical">
                <iframe src="sample2/index.html" title="과제 2"></iframe>
            </div>
        </section>

        <section class="card animate-up delay-3">
            <div class="card-header">
                <span class="badge dynamic">동적</span>
                <h2>과제 3: 움직이는 캐릭터 그리기</h2>
            </div>
            <div class="iframe-container ratio-vertical">
                <iframe src="sample3/index.html" title="과제 3"></iframe>
            </div>
        </section>
    </main>

    <footer>
        <p>@ 2026 숭실대 20251488 이승규</p>
    </footer>

</body>
</html>
